name: Android Lint

on:
  pull_request:
    branches: [ main, master, develop ]
  push:
    branches: [ main, master, develop ]

jobs:
  lint:
    name: Run Lint Checks
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      
      - name: Run Lint
        run: ./gradlew lintDebug --continue
      
      - name: Check Lint Results
        run: |
          if grep -q "Priority: 1" app/build/reports/lint-results-debug.xml || \
             grep -q "Severity=\"Error\"" app/build/reports/lint-results-debug.xml || \
             grep -q "Severity=\"Warning\"" app/build/reports/lint-results-debug.xml; then
            echo "❌ Lint found errors or warnings!"
            cat app/build/reports/lint-results-debug.txt || echo "No text report available"
            exit 1
          else
            echo "✅ No lint issues found!"
          fi
      
      - name: Upload Lint Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-results
          path: |
            app/build/reports/lint-results-*.html
            app/build/reports/lint-results-*.xml
            app/build/reports/lint-results-*.txt
      
      - name: Comment Lint Results on PR
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            
            const MAX_COMMENT_LENGTH = 60000;
            
            let reportContent = '';
            const txtReport = 'app/build/reports/lint-results-debug.txt';
            const htmlReport = 'app/build/reports/lint-results-debug.html';
            
            if (fs.existsSync(txtReport)) {
              reportContent = fs.readFileSync(txtReport, 'utf8');
            } else if (fs.existsSync(htmlReport)) {
              reportContent = '❌ Lint check failed! Download the HTML report from the Actions artifacts for details.';
            } else {
              reportContent = '❌ Lint check failed! Check the workflow logs for details.';
            }
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## ❌ Lint Check Failed\n\n\`\`\`\n${reportContent.slice(0, MAX_COMMENT_LENGTH)}\n\`\`\`\n\nPlease fix the lint errors before merging.\n\n📊 View detailed reports in the [workflow artifacts](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}).`
            });

