name: Android Lint

on:
  pull_request:
    branches: [ main, master, develop ]
  push:
    branches: [ main, master, develop ]

jobs:
  lint:
    name: Run Lint Checks
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      
      - name: Run Lint
        run: ./gradlew lintDebug --continue
      
      - name: Check Lint Results
        run: |
          if grep -q "Priority: 1" app/build/reports/lint-results-debug.xml || \
             grep -q "Severity=\"Error\"" app/build/reports/lint-results-debug.xml || \
             grep -q "Severity=\"Warning\"" app/build/reports/lint-results-debug.xml; then
            echo "❌ Lint found errors or warnings!"
            cat app/build/reports/lint-results-debug.txt || echo "No text report available"
            exit 1
          else
            echo "✅ No lint issues found!"
          fi
      
      - name: Upload Lint Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-results
          path: |
            app/build/reports/lint-results-*.html
            app/build/reports/lint-results-*.xml
      
      - name: Comment Lint Results on PR
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const lintReport = 'app/build/reports/lint-results-debug.txt';
            if (fs.existsSync(lintReport)) {
              const content = fs.readFileSync(lintReport, 'utf8');
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `## ❌ Lint Check Failed\n\n\`\`\`\n${content.slice(0, 60000)}\n\`\`\`\n\nPlease fix the lint errors before merging.`
              });
            }

